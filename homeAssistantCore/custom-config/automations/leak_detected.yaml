id: leak_detected
alias: Leak Detected
trigger:
  - platform: state
    entity_id: binary_sensor.leak_bathroom_water_leak
    to: "on"
  - platform: state
    entity_id: binary_sensor.leak_kitchen_water_leak
    to: "on"
action:
  - service: notify.mobile_app_luis_handy
    data:
      message: TTS
      data:
        ttl: 0
        priority: high
        media_stream: alarm_stream_max
        tts_text: "A leak has been detected in area {{ area_name(trigger.entity_id) }}"
  - service: switch.turn_on
    target:
      entity_id: switch.kiosk_bildschirm
  - service: media_player.volume_set
    target:
      entity_id: media_player.kiosk
    data:
      volume_level: 1
  - service: notify.send_message
    target:
      entity_id: notify.kiosk_text_zu_sprache
    data:
      message: "A leak has been detected in area {{ area_name(trigger.entity_id) }}"
  - service: notify.mobile_app_luis_handy
    data:
      title: "Leak Detected"
      message: "A leak has been detected in area {{ area_name(trigger.entity_id) }}"
      data:
        ttl: 0
        priority: high
