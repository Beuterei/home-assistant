type: grid
column_span: 1
cards:
  - type: heading
    heading_style: title
    heading: Living Room
    icon: mdi:sofa
    grid_options:
      columns: full
      rows: 1
  - type: custom:mushroom-climate-card
    entity: climate.living_room
    show_temperature_control: true
    hvac_modes:
      - heat
      - 'off'
    fill_container: true
    grid_options:
      columns: full
  - type: custom:mini-graph-card
    line_color: red
    entities:
      - entity: sensor.living_room_thermostat_temperature
    fill_container: true
    grid_options:
      columns: 6
      rows: 2.65
  - type: custom:mini-graph-card
    line_color: blue
    entities:
      - entity: sensor.living_room_thermostat_humidity
    fill_container: true
    grid_options:
      columns: 6
      rows: 2.65
