views:
  - title: Kiosk
    path: kiosk
    type: sections
    max_columns: 2
    icon: mdi:tablet-dashboard
    badges:
      - type: entity
        show_name: true
        show_state: false
        show_icon: true
        entity: light.all_lights
        name: All Off
        icon: mdi:lightbulb-off
        color: red
        tap_action:
          action: perform-action
          perform_action: light.turn_off
          target:
            entity_id: light.all_lights
      - type: entity
        show_name: true
        show_state: false
        show_icon: true
        entity: light.all_lights
        name: Reset Lights
        icon: mdi:restore
        color: amber
        tap_action:
          action: perform-action
          perform_action: scene.turn_on
          target:
            entity_id: scene.reset_light
    sections: !include_dir_list sections/
